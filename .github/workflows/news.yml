name: News-Alarm

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Minuten (GitHub kann sich etwas verspäten)
  workflow_dispatch:         # Knopf zum manuellen Starten

permissions:
  contents: write

concurrency: news-alarm

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: News prüfen
        run: python3 bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Gesehene News speichern
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "seen aktualisiert" && git push)
